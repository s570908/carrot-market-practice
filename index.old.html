<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>웹 푸시 알림 테스트</title>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
    <script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey=mJ6mBP6tQV36Iy6kld88d47kCwo3GGs11IBkoxf7"></script>
</head>
<body>
    <div id="map_div"></div>
    <div class="controls">
        <button id="update-button">Service Worker 업데이트 확인</button>
        <p id="update-status"></p>
    </div>

    <script>
        var map = new Tmapv2.Map("map_div", {
            // 지도가 생성될 div
            center: new Tmapv2.LatLng(37.57216786291851, 126.98577404022258), // 지도의 중심좌표
            width: "750px", // 지도의 넓이
            height: "750px", // 지도의 높이
            zoom: 15, // 지도의 줌레벨
            httpsMode: true, // https모드 설정
        });

        // 지도 타입 변경: ROAD
        map.setMapType(Tmapv2.Map.MapType.ROAD);

        // 이벤트의 종류와 해당 이벤트 발생 시 실행할 함수를 리스너를 통해 등록합니다.
        map.addListener("click", function (e) {
            console.log("클릭한 위치의 좌표는" + e.latLng + "입니다.");
        });

        // Service Worker 등록 및 업데이트 관리
        async function initServiceWorker() {
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.register('/sw.js');
                    setupUpdateCheck(registration);
                } catch (error) {
                    console.error('Service Worker 등록 실패:', error);
                }
            }
        }

        // 업데이트 체크 설정
        function setupUpdateCheck(registration) {
            const updateButton = document.getElementById('update-button');
            const statusText = document.getElementById('update-status');

            // 수동 업데이트 체크
            updateButton.addEventListener('click', async () => {
                statusText.textContent = '업데이트 확인 중...';
                try {
                    await checkForUpdates(registration);
                    statusText.textContent = '업데이트 체크 완료';
                } catch (error) {
                    statusText.textContent = '업데이트 체크 실패';
                    console.error(error);
                }
            });
        }

        // 페이지 로드 시 초기화
        initServiceWorker();
    </script>
</body>
</html>
